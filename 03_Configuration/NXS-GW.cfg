! NexaSoft Office LAN - NXS-GW
! Replace CHANGE_ME secrets before deployment.
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption
!
hostname NXS-GW
!
boot-start-marker
boot-end-marker
!
enable secret CHANGE_ME_ENABLE_SECRET
username netadmin privilege 15 secret CHANGE_ME_ADMIN_SECRET
!
no ip domain-lookup
ip domain-name nexasoft.local
clock timezone IST 5 30
!
ip dhcp excluded-address 192.168.10.64 192.168.10.65
ip dhcp excluded-address 192.168.10.125 192.168.10.126
ip dhcp excluded-address 192.168.10.128 192.168.10.131
ip dhcp excluded-address 192.168.10.160 192.168.10.161
!
ip dhcp pool VLAN30-ENG
 network 192.168.10.64 255.255.255.192
 default-router 192.168.10.65
 dns-server 192.168.10.10
 domain-name nexasoft.local
 lease 1
!
ip dhcp pool VLAN20-STAFF
 network 192.168.10.128 255.255.255.224
 default-router 192.168.10.129
 dns-server 192.168.10.10
 domain-name nexasoft.local
 lease 1
!
ip dhcp pool VLAN40-GUEST
 network 192.168.10.160 255.255.255.224
 default-router 192.168.10.161
 dns-server 8.8.8.8
 domain-name guest.nexasoft.local
 lease 1
!
ip access-list standard NAT-INSIDE
 permit 192.168.10.0 0.0.0.255
!
ip access-list extended GUEST-IN
 permit udp any any eq 67
 permit udp any any eq 68
 deny ip any 192.168.10.0 0.0.0.255
 permit ip any any
!
ip access-list extended STAFF-MGMT
 deny ip any 192.168.10.192 0.0.0.15
 permit ip any any
!
access-list 10 permit 192.168.10.192 0.0.0.15
!
interface GigabitEthernet0/0
 description TRUNK TO NXS-CORE-SW Gi1/0/1
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description SERVERS VLAN 10
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.192
 ip nat inside
 no shutdown
!
interface GigabitEthernet0/0.20
 description STAFF VLAN 20
 encapsulation dot1Q 20
 ip address 192.168.10.129 255.255.255.224
 ip access-group STAFF-MGMT in
 ip nat inside
 no shutdown
!
interface GigabitEthernet0/0.30
 description ENGINEERING VLAN 30
 encapsulation dot1Q 30
 ip address 192.168.10.65 255.255.255.192
 ip access-group STAFF-MGMT in
 ip nat inside
 no shutdown
!
interface GigabitEthernet0/0.40
 description GUEST VLAN 40
 encapsulation dot1Q 40
 ip address 192.168.10.161 255.255.255.224
 ip access-group GUEST-IN in
 ip nat inside
 no shutdown
!
interface GigabitEthernet0/0.99
 description MANAGEMENT VLAN 99
 encapsulation dot1Q 99 native
 ip address 192.168.10.193 255.255.255.240
 no shutdown
!
interface GigabitEthernet0/1
 description ISP FIBRE HANDOFF
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
!
ip nat inside source list NAT-INSIDE interface GigabitEthernet0/1 overload
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
ip name-server 192.168.10.10
ip ssh version 2
do crypto key generate rsa modulus 2048
!
ntp server 192.168.10.10
logging host 192.168.10.10
logging buffered 16384
!
banner motd ^C
Authorized access only. NexaSoft Office LAN lab configuration.
^C
!
line con 0
 password CHANGE_ME_CONSOLE_SECRET
 login
 logging synchronous
line vty 0 15
 access-class 10 in
 transport input ssh
 login local
!
end
