! NexaSoft Office LAN - NXS-CORE-SW
! Replace CHANGE_ME secrets before deployment.
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption
!
hostname NXS-CORE-SW
enable secret CHANGE_ME_ENABLE_SECRET
username netadmin privilege 15 secret CHANGE_ME_ADMIN_SECRET
!
no ip domain-lookup
ip domain-name nexasoft.local
clock timezone IST 5 30
!
vlan 10
 name SERVERS
vlan 20
 name STAFF
vlan 30
 name ENGINEERING
vlan 40
 name GUEST
vlan 99
 name MANAGEMENT
vlan 999
 name UNUSED
!
vtp mode transparent
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,99 root primary
!
ip dhcp snooping
ip dhcp snooping vlan 20,30,40
no ip dhcp snooping information option
ip arp inspection vlan 20,30,40
!
interface Vlan99
 description MANAGEMENT SVI
 ip address 192.168.10.194 255.255.255.240
 no shutdown
!
ip default-gateway 192.168.10.193
ip name-server 192.168.10.10
!
interface GigabitEthernet1/0/1
 description TO NXS-GW G0/0
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,99
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface range GigabitEthernet1/0/2-3
 description FIBRE TO NXS-ENG-SW Po2
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 30,99
 channel-group 1 mode active
 no shutdown
!
interface Port-channel1
 description LACP TO NXS-ENG-SW
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 30,99
 ip dhcp snooping trust
 ip arp inspection trust
!
interface range GigabitEthernet1/0/4-6
 description SERVER PORTS VLAN 10
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
!
interface range GigabitEthernet1/0/7-23
 description STAFF AND PRINTER PORTS VLAN 20
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
!
interface GigabitEthernet1/0/24
 description CEILING AP AP-ENG
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 20,30,40,99
 switchport nonegotiate
 spanning-tree portfast trunk
 spanning-tree bpduguard enable
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface range GigabitEthernet1/0/25-26
 description CEILING AP TRUNKS - AP-STAFF AP-MGMT
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 20,40,99
 switchport nonegotiate
 spanning-tree portfast trunk
 spanning-tree bpduguard enable
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface GigabitEthernet1/0/27
 description ENGINEERING PRINTER VLAN 30
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
!
interface range GigabitEthernet1/0/28-48
 description UNUSED PORTS
 switchport mode access
 switchport access vlan 999
 shutdown
!
access-list 10 permit 192.168.10.192 0.0.0.15
ip ssh version 2
do crypto key generate rsa modulus 2048
errdisable recovery cause psecure-violation
errdisable recovery cause bpduguard
errdisable recovery interval 300
!
ntp server 192.168.10.10
logging host 192.168.10.10
logging buffered 16384
!
banner motd ^C
Authorized access only. NexaSoft Office LAN lab configuration.
^C
!
line con 0
 password CHANGE_ME_CONSOLE_SECRET
 login
 logging synchronous
line vty 0 15
 access-class 10 in
 transport input ssh
 login local
!
end
